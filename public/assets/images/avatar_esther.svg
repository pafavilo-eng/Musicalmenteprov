<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="esther_bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="60%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#831843" />
    </radialGradient>

    <!-- 3D Skin Depth (Soft Peachy Glow) -->
    <radialGradient id="esther_skin" cx="40%" cy="30%" fx="32%" fy="22%" r="65%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="60%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba858" />
    </radialGradient>

    <!-- 3D Warm Brown Hair -->
    <radialGradient id="esther_hair" cx="38%" cy="25%" fx="30%" fy="18%" r="65%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="60%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c0901" />
    </radialGradient>

    <!-- Golden Crown Gradient -->
    <linearGradient id="crown_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Royal Robe Purple/Pink -->
    <linearGradient id="royal_robe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <filter id="shadow_3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="128" fill="url(#esther_bg)" />
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Singing Golden Musical Notes -->
  <g opacity="0.5" fill="#fef08a" transform="translate(34, 40) scale(0.65)">
    <circle cx="12" cy="22" r="7" />
    <rect x="17" y="4" width="3" height="18" rx="1.5" />
    <path d="M 20 4 C 28 4, 34 8, 34 16 C 30 14, 25 12, 20 12 Z" />
  </g>
  <g opacity="0.5" fill="#fef08a" transform="translate(198, 48) scale(0.6)">
    <circle cx="10" cy="20" r="6" />
    <circle cx="28" cy="16" r="6" />
    <rect x="14" y="4" width="3" height="16" rx="1.5" />
    <rect x="32" y="0" width="3" height="16" rx="1.5" />
    <polygon points="14,4 35,0 35,5 14,9" />
  </g>

  <!-- Main 3D Cartoon Esther Character -->
  <g filter="url(#shadow_3d)">
    <!-- Flowing Hair Back -->
    <path d="M 64 120 C 58 175, 78 220, 92 230 C 98 200, 96 160, 96 140 C 96 90, 160 90, 160 140 C 160 160, 158 200, 164 230 C 178 220, 198 175, 192 120 C 196 65, 60 65, 64 120 Z" fill="url(#esther_hair)" />

    <!-- Royal Dress / Shoulders -->
    <ellipse cx="128" cy="220" rx="56" ry="40" fill="url(#royal_robe)" />
    <!-- White / Gold collar lace -->
    <path d="M 104 180 Q 128 198 152 180" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="118" y="160" width="20" height="24" rx="10" fill="url(#esther_skin)" />

    <!-- 3D Child Face with Rounded Cheeks -->
    <ellipse cx="128" cy="128" rx="46" ry="48" fill="url(#esther_skin)" />

    <!-- Front Hair Bangs with Soft 3D Curls -->
    <path d="M 82 108 C 88 88, 120 86, 128 100 C 136 86, 168 88, 174 108 C 160 96, 138 98, 128 108 C 118 98, 96 96, 82 108 Z" fill="url(#esther_hair)" />

    <!-- Golden Princess Tiara -->
    <path d="M 86 92 L 96 74 L 112 85 L 128 64 L 144 85 L 160 74 L 170 92 Z" fill="url(#crown_gold)" stroke="#ca8a04" stroke-width="1.5" stroke-linejoin="round" />
    <circle cx="128" cy="72" r="3.5" fill="#ef4444" />
    <circle cx="98" cy="80" r="2.8" fill="#3b82f6" />
    <circle cx="158" cy="80" r="2.8" fill="#3b82f6" />
    <!-- Pearl band at tiara base -->
    <ellipse cx="128" cy="92" rx="40" ry="4" fill="none" stroke="#fef08a" stroke-width="2" />

    <!-- Big Expressive Brown Cartoon Eyes -->
    <ellipse cx="110" cy="125" rx="10" ry="13" fill="#ffffff" />
    <ellipse cx="146" cy="125" rx="10" ry="13" fill="#ffffff" />
    <!-- Iris -->
    <circle cx="111" cy="125" r="7.5" fill="#78350f" />
    <circle cx="145" cy="125" r="7.5" fill="#78350f" />
    <!-- Pupil -->
    <circle cx="111" cy="125" r="4.5" fill="#1c0901" />
    <circle cx="145" cy="125" r="4.5" fill="#1c0901" />
    <!-- 3D Specular Catchlights -->
    <circle cx="109" cy="122" r="3" fill="#ffffff" />
    <circle cx="143" cy="122" r="3" fill="#ffffff" />
    <circle cx="113" cy="127" r="1.3" fill="#ffffff" />
    <circle cx="147" cy="127" r="1.3" fill="#ffffff" />
    <!-- Eyelashes & Brows -->
    <path d="M 98 116 Q 110 112 122 116" stroke="#451a03" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 134 116 Q 146 112 158 116" stroke="#451a03" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Cute Small Nose -->
    <path d="M 127 132 Q 128 136 129 132" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Rosy Glowing Cheeks -->
    <circle cx="96" cy="138" r="9" fill="#f43f5e" opacity="0.45" />
    <circle cx="160" cy="138" r="9" fill="#f43f5e" opacity="0.45" />

    <!-- Gentle Friendly Smile -->
    <path d="M 119 146 Q 128 156 137 146" stroke="#be185d" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Musical Praise Parchment Scroll held gently -->
    <g transform="translate(100, 185)">
      <rect x="0" y="0" width="56" height="28" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
      <line x1="10" y1="8" x2="46" y2="8" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />
      <line x1="10" y1="14" x2="46" y2="14" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />
      <line x1="10" y1="20" x2="36" y2="20" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Cute Hands holding scroll -->
    <circle cx="98" cy="198" r="8" fill="url(#esther_skin)" />
    <circle cx="158" cy="198" r="8" fill="url(#esther_skin)" />
  </g>
</svg>