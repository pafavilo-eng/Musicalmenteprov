<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bird_bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <!-- 3D Blue Feathers -->
    <radialGradient id="bird_feathers" cx="38%" cy="30%" fx="30%" fy="22%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>

    <!-- 3D Yellow Belly -->
    <radialGradient id="bird_belly" cx="42%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <!-- Golden Flute -->
    <linearGradient id="flute_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <filter id="shadow_3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="128" fill="url(#bird_bg)" />
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Main 3D Cartoon Bird (Passarinho Flautista) -->
  <g filter="url(#shadow_3d)">
    <!-- Bird Wings -->
    <ellipse cx="64" cy="180" rx="16" ry="34" fill="url(#bird_feathers)" transform="rotate(25 64 180)" />
    <ellipse cx="192" cy="180" rx="16" ry="34" fill="url(#bird_feathers)" transform="rotate(-25 192 180)" />

    <!-- Round 3D Body -->
    <ellipse cx="128" cy="185" rx="54" ry="48" fill="url(#bird_feathers)" />
    <!-- Yellow Fluffy Chest -->
    <ellipse cx="128" cy="190" rx="38" ry="38" fill="url(#bird_belly)" />

    <!-- Cute Red Bowtie -->
    <polygon points="112,156 128,162 112,168" fill="#ef4444" />
    <polygon points="144,156 128,162 144,168" fill="#ef4444" />
    <circle cx="128" cy="162" r="3.2" fill="#991b1b" />

    <!-- 3D Spherical Head -->
    <circle cx="128" cy="114" r="46" fill="url(#bird_feathers)" />

    <!-- Cute Feather Crest on Top -->
    <path d="M 124 68 C 118 48, 138 46, 134 68 Z" fill="#60a5fa" />
    <path d="M 130 68 C 128 54, 146 52, 140 68 Z" fill="#93c5fd" />

    <!-- Big Expressive Cartoon Eyes -->
    <ellipse cx="112" cy="112" rx="9" ry="12" fill="#ffffff" />
    <ellipse cx="144" cy="112" rx="9" ry="12" fill="#ffffff" />
    <circle cx="113" cy="112" r="6.5" fill="#0f172a" />
    <circle cx="143" cy="112" r="6.5" fill="#0f172a" />
    <circle cx="111" cy="109" r="2.8" fill="#ffffff" />
    <circle cx="141" cy="109" r="2.8" fill="#ffffff" />
    <circle cx="115" cy="114" r="1.2" fill="#ffffff" />
    <circle cx="145" cy="114" r="1.2" fill="#ffffff" />

    <!-- Rosy Cheeks -->
    <circle cx="94" cy="126" r="8" fill="#f43f5e" opacity="0.4" />
    <circle cx="162" cy="126" r="8" fill="#f43f5e" opacity="0.4" />

    <!-- Cute Orange Beak -->
    <polygon points="120,120 136,120 128,134" fill="#f97316" stroke="#c2410c" stroke-width="1" />

    <!-- Golden Flute held sideways -->
    <g transform="translate(94, 132) rotate(-12)">
      <rect x="0" y="0" width="76" height="6" rx="3" fill="url(#flute_gold)" stroke="#854d0e" stroke-width="1" />
      <circle cx="12" cy="3" r="1.5" fill="#451a03" />
      <circle cx="28" cy="3" r="1.5" fill="#451a03" />
      <circle cx="38" cy="3" r="1.5" fill="#451a03" />
      <circle cx="48" cy="3" r="1.5" fill="#451a03" />
      <circle cx="58" cy="3" r="1.5" fill="#451a03" />
    </g>

    <!-- Tiny Bird Wings holding the flute -->
    <circle cx="116" cy="144" r="7" fill="url(#bird_feathers)" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="148" cy="138" r="7" fill="url(#bird_feathers)" stroke="#1d4ed8" stroke-width="1" />
  </g>
</svg>
