<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Background 3D Radial Gradient -->
    <radialGradient id="bg_monkey_3d" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- Monkey Brown Fur 3D Gradient -->
    <radialGradient id="monkey_fur_3d" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="65%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <!-- Monkey Skin Face 3D Gradient -->
    <radialGradient id="monkey_skin_3d" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="70%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#fb923c" />
    </radialGradient>

    <!-- Bongo Drum Wood Gradient -->
    <linearGradient id="drum_wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="monkey_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="75" fill="url(#bg_monkey_3d)" />
  <circle cx="150" cy="150" r="130" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Floating Rhythm Musical Notes -->
  <g fill="rgba(255,255,255,0.4)" transform="translate(35, 45)">
    <circle cx="12" cy="18" r="5" />
    <rect x="16" y="2" width="2.5" height="16" rx="1" />
    <path d="M 19 2 Q 26 2 28 8 Q 23 8 19 6 Z" />
  </g>
  <g fill="rgba(255,255,255,0.35)" transform="translate(235, 55)">
    <circle cx="10" cy="16" r="5" />
    <circle cx="26" cy="13" r="5" />
    <rect x="14" y="4" width="2.5" height="13" rx="1" />
    <rect x="30" y="1" width="2.5" height="13" rx="1" />
    <polygon points="14,4 32,1 32,5 14,8" />
  </g>

  <!-- Main 3D Monkey Character (Joyful, energetic percussionist) -->
  <g filter="url(#monkey_shadow)">
    <!-- Big Cute 3D Ears -->
    <circle cx="75" cy="140" r="28" fill="url(#monkey_fur_3d)" />
    <circle cx="75" cy="140" r="18" fill="url(#monkey_skin_3d)" />
    <circle cx="225" cy="140" r="28" fill="url(#monkey_fur_3d)" />
    <circle cx="225" cy="140" r="18" fill="url(#monkey_skin_3d)" />

    <!-- Head -->
    <circle cx="150" cy="135" r="65" fill="url(#monkey_fur_3d)" />
    <!-- Forehead Highlight -->
    <ellipse cx="140" cy="95" rx="24" ry="12" fill="#ffffff" opacity="0.35" />

    <!-- Cute Heart-shaped Face Mask -->
    <path d="M 150 115 C 130 95, 95 105, 102 145 C 105 175, 135 185, 150 185 C 165 185, 195 175, 198 145 C 205 105, 170 95, 150 115 Z" fill="url(#monkey_skin_3d)" />

    <!-- Big Sparkling Pixar Eyes -->
    <g transform="translate(124, 136)">
      <ellipse cx="0" cy="0" rx="11" ry="14" fill="#ffffff" />
      <circle cx="1" cy="0" r="9" fill="#451a03" />
      <circle cx="2" cy="1" r="6" fill="#18181b" />
      <circle cx="-2" cy="-4" r="4" fill="#ffffff" />
      <circle cx="3" cy="3" r="1.8" fill="#ffffff" />
    </g>

    <g transform="translate(176, 136)">
      <ellipse cx="0" cy="0" rx="11" ry="14" fill="#ffffff" />
      <circle cx="-1" cy="0" r="9" fill="#451a03" />
      <circle cx="-2" cy="1" r="6" fill="#18181b" />
      <circle cx="-4" cy="-4" r="4" fill="#ffffff" />
      <circle cx="1" cy="3" r="1.8" fill="#ffffff" />
    </g>

    <!-- Cute Snout Nostrils -->
    <ellipse cx="145" cy="155" rx="2.5" ry="3.5" fill="#451a03" />
    <ellipse cx="155" cy="155" rx="2.5" ry="3.5" fill="#451a03" />

    <!-- Big Cheerful Monkey Grin -->
    <path d="M 128 165 Q 150 180 172 165" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 134 167 Q 150 178 166 167" fill="#f43f5e" />

    <!-- Rosy Cheeks -->
    <circle cx="106" cy="158" r="9" fill="#f43f5e" opacity="0.4" />
    <circle cx="194" cy="158" r="9" fill="#f43f5e" opacity="0.4" />

    <!-- Chubby Body -->
    <ellipse cx="150" cy="225" rx="50" ry="38" fill="url(#monkey_fur_3d)" />
    <ellipse cx="150" cy="220" rx="28" ry="25" fill="url(#monkey_skin_3d)" />
  </g>

  <!-- 3D Bongo Drums in Foreground -->
  <g transform="translate(85, 220)">
    <!-- Left Bongo -->
    <path d="M 10 20 L 20 60 L 55 60 L 65 20 Z" fill="url(#drum_wood)" stroke="#ca8a04" stroke-width="2" />
    <ellipse cx="37" cy="20" rx="28" ry="12" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
    <!-- Right Bongo -->
    <path d="M 70 20 L 78 60 L 115 60 L 125 20 Z" fill="url(#drum_wood)" stroke="#ca8a04" stroke-width="2" />
    <ellipse cx="97" cy="20" rx="27" ry="12" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
  </g>

  <!-- Paws Drumming with Rhythm -->
  <ellipse cx="115" cy="225" rx="12" ry="9" fill="url(#monkey_skin_3d)" />
  <ellipse cx="185" cy="225" rx="12" ry="9" fill="url(#monkey_skin_3d)" />
</svg>