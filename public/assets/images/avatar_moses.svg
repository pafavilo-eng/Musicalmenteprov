<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="moses_bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- 3D Skin -->
    <radialGradient id="moses_skin" cx="40%" cy="30%" fx="32%" fy="22%" r="65%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="60%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba858" />
    </radialGradient>

    <!-- 3D Hair & Beard -->
    <radialGradient id="moses_hair" cx="38%" cy="25%" fx="30%" fy="18%" r="65%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="60%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c0901" />
    </radialGradient>

    <filter id="shadow_3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="128" fill="url(#moses_bg)" />
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Main 3D Cartoon Moses -->
  <g filter="url(#shadow_3d)">
    <!-- Sand-colored Tunic & Burgundy Cloak -->
    <ellipse cx="128" cy="222" rx="58" ry="42" fill="#d97706" />
    <path d="M 76 195 L 180 240 L 160 250 L 66 205 Z" fill="#991b1b" />

    <!-- Neck -->
    <rect x="118" y="160" width="20" height="24" rx="10" fill="url(#moses_skin)" />

    <!-- 3D Friendly Face -->
    <ellipse cx="128" cy="126" rx="46" ry="48" fill="url(#moses_skin)" />

    <!-- Soft, Child-friendly Rounded Beard (Friendly, not scary) -->
    <path d="M 94 136 C 94 172, 162 172, 162 136 C 154 164, 102 164, 94 136 Z" fill="url(#moses_hair)" />

    <!-- Hair with Volume and Curls -->
    <path d="M 80 114 C 74 80, 100 68, 128 68 C 156 68, 182 80, 176 114 C 182 100, 170 82, 150 82 C 136 82, 134 92, 128 92 C 122 92, 120 82, 106 82 C 86 82, 74 100, 80 114 Z" fill="url(#moses_hair)" />

    <!-- Big Kind Cartoon Eyes -->
    <ellipse cx="110" cy="124" rx="10" ry="13" fill="#ffffff" />
    <ellipse cx="146" cy="124" rx="10" ry="13" fill="#ffffff" />
    <circle cx="111" cy="124" r="7.5" fill="#451a03" />
    <circle cx="145" cy="124" r="7.5" fill="#451a03" />
    <circle cx="111" cy="124" r="4.5" fill="#000000" />
    <circle cx="145" cy="124" r="4.5" fill="#000000" />
    <circle cx="109" cy="121" r="3" fill="#ffffff" />
    <circle cx="143" cy="121" r="3" fill="#ffffff" />
    <circle cx="113" cy="126" r="1.3" fill="#ffffff" />
    <circle cx="147" cy="126" r="1.3" fill="#ffffff" />
    <!-- Kind Eyebrows -->
    <path d="M 98 112 Q 110 108 122 112" stroke="#451a03" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 134 112 Q 146 108 158 112" stroke="#451a03" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Button Nose -->
    <path d="M 127 132 Q 128 136 129 132" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="96" cy="136" r="9" fill="#f43f5e" opacity="0.4" />
    <circle cx="160" cy="136" r="9" fill="#f43f5e" opacity="0.4" />

    <!-- Big Kind Gentle Smile -->
    <path d="M 118 144 Q 128 154 138 144" stroke="#9a3412" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Smooth Wooden Staff held gently -->
    <g transform="translate(182, 130) rotate(-8)">
      <rect x="0" y="0" width="8" height="90" rx="4" fill="#92400e" stroke="#78350f" stroke-width="1.5" />
      <path d="M 0 0 C 0 -12, 14 -12, 14 0" stroke="#78350f" stroke-width="2.5" fill="none" />
    </g>

    <!-- Hand holding staff -->
    <circle cx="180" cy="180" r="9" fill="url(#moses_skin)" />
  </g>
</svg>