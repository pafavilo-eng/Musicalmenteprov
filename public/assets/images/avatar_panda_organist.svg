<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Background 3D Radial Gradient -->
    <radialGradient id="bg_panda_3d" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <!-- White Fur 3D Gradient -->
    <radialGradient id="panda_white_3d" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <!-- Black Fur 3D Gradient -->
    <radialGradient id="panda_black_3d" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Organ Golden Pipes Gradient -->
    <linearGradient id="organ_gold_3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <filter id="panda_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="75" fill="url(#bg_panda_3d)" />
  <circle cx="150" cy="150" r="130" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- 3D Pipe Organ in Background -->
  <g opacity="0.45" transform="translate(60, 25)">
    <rect x="15" y="40" width="16" height="110" rx="8" fill="url(#organ_gold_3d)" />
    <rect x="40" y="20" width="18" height="130" rx="9" fill="url(#organ_gold_3d)" />
    <rect x="70" y="5" width="22" height="145" rx="11" fill="url(#organ_gold_3d)" />
    <rect x="100" y="0" width="24" height="150" rx="12" fill="url(#organ_gold_3d)" />
    <rect x="132" y="5" width="22" height="145" rx="11" fill="url(#organ_gold_3d)" />
    <rect x="162" y="20" width="18" height="130" rx="9" fill="url(#organ_gold_3d)" />
    <rect x="188" y="40" width="16" height="110" rx="8" fill="url(#organ_gold_3d)" />
  </g>

  <!-- Floating musical note decoration -->
  <g fill="rgba(255,255,255,0.4)" transform="translate(35, 50)">
    <circle cx="12" cy="18" r="6" />
    <rect x="16" y="2" width="3" height="16" rx="1.5" />
    <path d="M 19 2 Q 28 2 30 9 Q 24 9 19 6 Z" />
  </g>

  <!-- 3D Chubby Panda Character -->
  <g filter="url(#panda_shadow)">
    <!-- Ears -->
    <circle cx="95" cy="85" r="26" fill="url(#panda_black_3d)" />
    <circle cx="95" cy="85" r="16" fill="#334155" opacity="0.5" />
    <circle cx="205" cy="85" r="26" fill="url(#panda_black_3d)" />
    <circle cx="205" cy="85" r="16" fill="#334155" opacity="0.5" />

    <!-- Head -->
    <ellipse cx="150" cy="142" rx="72" ry="64" fill="url(#panda_white_3d)" />
    <!-- 3D Top Highlight -->
    <ellipse cx="140" cy="105" rx="28" ry="12" fill="#ffffff" opacity="0.6" />

    <!-- Big Cute Eye Patches -->
    <ellipse cx="112" cy="136" rx="20" ry="24" fill="url(#panda_black_3d)" transform="rotate(-15 112 136)" />
    <ellipse cx="188" cy="136" rx="20" ry="24" fill="url(#panda_black_3d)" transform="rotate(15 188 136)" />

    <!-- Big Sparkling Cartoon Eyes -->
    <circle cx="114" cy="136" r="9" fill="#0f172a" />
    <circle cx="112" cy="133" r="3.5" fill="#ffffff" />
    <circle cx="116" cy="138" r="1.5" fill="#ffffff" />

    <circle cx="186" cy="136" r="9" fill="#0f172a" />
    <circle cx="184" cy="133" r="3.5" fill="#ffffff" />
    <circle cx="188" cy="138" r="1.5" fill="#ffffff" />

    <!-- 3D Shiny Cute Black Nose -->
    <ellipse cx="150" cy="155" rx="11" ry="8" fill="url(#panda_black_3d)" />
    <circle cx="148" cy="153" r="2.5" fill="#ffffff" opacity="0.75" />

    <!-- Sweet Grin Smile -->
    <path d="M 142 165 Q 150 172 158 165" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheeks -->
    <circle cx="95" cy="158" r="10" fill="#f43f5e" opacity="0.3" />
    <circle cx="205" cy="158" r="10" fill="#f43f5e" opacity="0.3" />

    <!-- Panda Body & Organist Tuxedo / Bowtie -->
    <ellipse cx="150" cy="225" rx="55" ry="40" fill="url(#panda_black_3d)" />
    <ellipse cx="150" cy="220" rx="30" ry="28" fill="url(#panda_white_3d)" />

    <!-- Cute Red Bowtie -->
    <polygon points="135,182 150,188 135,194" fill="#ef4444" />
    <polygon points="165,182 150,188 165,194" fill="#ef4444" />
    <circle cx="150" cy="188" r="4.5" fill="#b91c1c" />
  </g>

  <!-- Keyboard / Piano Keys in Foreground -->
  <g transform="translate(45, 230)">
    <rect x="0" y="0" width="210" height="45" rx="10" fill="#1e293b" />
    <!-- White Keys with 3D Depth -->
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
      <rect x="10" y="5" width="18" height="35" rx="4" />
      <rect x="30" y="5" width="18" height="35" rx="4" />
      <rect x="50" y="5" width="18" height="35" rx="4" />
      <rect x="70" y="5" width="18" height="35" rx="4" />
      <rect x="90" y="5" width="18" height="35" rx="4" />
      <rect x="110" y="5" width="18" height="35" rx="4" />
      <rect x="130" y="5" width="18" height="35" rx="4" />
      <rect x="150" y="5" width="18" height="35" rx="4" />
      <rect x="170" y="5" width="18" height="35" rx="4" />
    </g>
    <!-- Black Keys -->
    <g fill="#090d16">
      <rect x="23" y="5" width="11" height="22" rx="2" />
      <rect x="43" y="5" width="11" height="22" rx="2" />
      <rect x="83" y="5" width="11" height="22" rx="2" />
      <rect x="103" y="5" width="11" height="22" rx="2" />
      <rect x="123" y="5" width="11" height="22" rx="2" />
      <rect x="163" y="5" width="11" height="22" rx="2" />
    </g>
  </g>

  <!-- Paws on the Keyboard -->
  <ellipse cx="105" cy="235" rx="16" ry="12" fill="url(#panda_black_3d)" />
  <ellipse cx="195" cy="235" rx="16" ry="12" fill="url(#panda_black_3d)" />
</svg>