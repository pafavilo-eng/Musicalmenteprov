<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Background 3D Radial Gradient -->
    <radialGradient id="bg_frog_3d" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="60%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </radialGradient>

    <!-- Frog Green 3D Skin Gradient -->
    <radialGradient id="frog_skin_3d" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="65%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#3f6212" />
    </radialGradient>

    <!-- Frog Cream Belly 3D Gradient -->
    <radialGradient id="frog_belly_3d" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="65%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <filter id="frog_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#365314" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="75" fill="url(#bg_frog_3d)" />
  <circle cx="150" cy="150" r="130" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Singing Sound Wave Musical Notes -->
  <g fill="rgba(255,255,255,0.4)" transform="translate(35, 45)">
    <circle cx="12" cy="18" r="5" />
    <rect x="16" y="2" width="2.5" height="16" rx="1" />
    <path d="M 19 2 Q 26 2 28 8 Q 23 8 19 6 Z" />
  </g>
  <g fill="rgba(255,255,255,0.35)" transform="translate(235, 50)">
    <circle cx="10" cy="16" r="5" />
    <circle cx="26" cy="13" r="5" />
    <rect x="14" y="4" width="2.5" height="13" rx="1" />
    <rect x="30" y="1" width="2.5" height="13" rx="1" />
    <polygon points="14,4 32,1 32,5 14,8" />
  </g>

  <!-- Main 3D Frog Character (Singing melody with wide joyful smile) -->
  <g filter="url(#frog_shadow)">
    <!-- Big 3D Eye Spheres on Top of Head -->
    <circle cx="105" cy="100" r="28" fill="url(#frog_skin_3d)" />
    <circle cx="195" cy="100" r="28" fill="url(#frog_skin_3d)" />

    <!-- Cute Big Pixar Eyes -->
    <g transform="translate(105, 100)">
      <ellipse cx="0" cy="0" rx="18" ry="19" fill="#ffffff" />
      <circle cx="2" cy="0" r="12" fill="#0f172a" />
      <circle cx="-3" cy="-4" r="5" fill="#ffffff" />
      <circle cx="4" cy="4" r="2.2" fill="#ffffff" />
    </g>

    <g transform="translate(195, 100)">
      <ellipse cx="0" cy="0" rx="18" ry="19" fill="#ffffff" />
      <circle cx="-2" cy="0" r="12" fill="#0f172a" />
      <circle cx="-5" cy="-4" r="5" fill="#ffffff" />
      <circle cx="2" cy="4" r="2.2" fill="#ffffff" />
    </g>

    <!-- Wide 3D Puffy Head & Cheeks -->
    <ellipse cx="150" cy="145" rx="76" ry="50" fill="url(#frog_skin_3d)" />
    <!-- 3D Specular Highlight -->
    <ellipse cx="150" cy="120" rx="25" ry="10" fill="#ffffff" opacity="0.4" />

    <!-- Cute Snout Dots -->
    <circle cx="145" cy="135" r="2" fill="#365314" />
    <circle cx="155" cy="135" r="2" fill="#365314" />

    <!-- Big Joyful Singing Mouth -->
    <path d="M 105 148 Q 150 185 195 148" stroke="#365314" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 115 152 Q 150 188 185 152 Q 150 162 115 152 Z" fill="#f43f5e" />
    <!-- Cute pink tongue singing -->
    <path d="M 135 168 Q 150 160 165 168 Q 150 180 135 168 Z" fill="#fb7185" />

    <!-- Rosy Cheeks -->
    <circle cx="95" cy="148" r="11" fill="#f43f5e" opacity="0.35" />
    <circle cx="205" cy="148" r="11" fill="#f43f5e" opacity="0.35" />

    <!-- Chubby Body -->
    <ellipse cx="150" cy="225" rx="55" ry="40" fill="url(#frog_skin_3d)" />
    <ellipse cx="150" cy="218" rx="32" ry="26" fill="url(#frog_belly_3d)" />

    <!-- Classy Red Bowtie for the Singer -->
    <polygon points="135,182 150,188 135,194" fill="#ef4444" />
    <polygon points="165,182 150,188 165,194" fill="#ef4444" />
    <circle cx="150" cy="188" r="4.5" fill="#b91c1c" />
  </g>

  <!-- Cute Vintage Microphone in Foreground -->
  <g transform="translate(135, 195)">
    <rect x="8" y="0" width="14" height="22" rx="7" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
    <!-- Mic grille lines -->
    <line x1="8" y1="6" x2="22" y2="6" stroke="#94a3b8" stroke-width="1" />
    <line x1="8" y1="11" x2="22" y2="11" stroke="#94a3b8" stroke-width="1" />
    <line x1="8" y1="16" x2="22" y2="16" stroke="#94a3b8" stroke-width="1" />
    <!-- Mic stand -->
    <rect x="13" y="22" width="4" height="35" rx="2" fill="#475569" />
  </g>

  <!-- Paws Gesturing with Melody -->
  <ellipse cx="105" cy="225" rx="12" ry="9" fill="url(#frog_skin_3d)" />
  <ellipse cx="195" cy="225" rx="12" ry="9" fill="url(#frog_skin_3d)" />
</svg>