<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Background 3D Radial Gradient -->
    <radialGradient id="bg_penguin_3d" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- Black Feather 3D Gradient -->
    <radialGradient id="penguin_black_3d" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- White Belly 3D Gradient -->
    <radialGradient id="penguin_white_3d" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>

    <!-- Clarinet Wood Gradient -->
    <linearGradient id="clarinet_body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <filter id="penguin_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="75" fill="url(#bg_penguin_3d)" />
  <circle cx="150" cy="150" r="130" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Floating musical notes -->
  <g fill="rgba(255,255,255,0.4)" transform="translate(35, 45)">
    <circle cx="12" cy="18" r="5" />
    <rect x="16" y="2" width="2.5" height="16" rx="1" />
    <path d="M 19 2 Q 26 2 28 8 Q 23 8 19 6 Z" />
  </g>
  <g fill="rgba(255,255,255,0.35)" transform="translate(235, 55)">
    <circle cx="10" cy="16" r="5" />
    <circle cx="26" cy="13" r="5" />
    <rect x="14" y="4" width="2.5" height="13" rx="1" />
    <rect x="30" y="1" width="2.5" height="13" rx="1" />
    <polygon points="14,4 32,1 32,5 14,8" />
  </g>

  <!-- Main 3D Penguin Character (Chubby, sweet, playing clarinet) -->
  <g filter="url(#penguin_shadow)">
    <!-- Flippers -->
    <ellipse cx="80" cy="190" rx="16" ry="32" fill="url(#penguin_black_3d)" transform="rotate(25 80 190)" />
    <ellipse cx="220" cy="190" rx="16" ry="32" fill="url(#penguin_black_3d)" transform="rotate(-25 220 190)" />

    <!-- Chubby Body & Head (Egg shape) -->
    <ellipse cx="150" cy="160" rx="66" ry="78" fill="url(#penguin_black_3d)" />
    <!-- 3D Forehead Highlight -->
    <ellipse cx="140" cy="105" rx="25" ry="12" fill="#ffffff" opacity="0.35" />

    <!-- White Belly Heart/Oval Shape -->
    <path d="M 150 115 C 130 95, 105 105, 110 145 C 112 185, 130 220, 150 220 C 170 220, 188 185, 190 145 C 195 105, 170 95, 150 115 Z" fill="url(#penguin_white_3d)" />

    <!-- Big Sparkling Pixar Eyes -->
    <g transform="translate(125, 134)">
      <ellipse cx="0" cy="0" rx="11" ry="14" fill="#ffffff" />
      <circle cx="1" cy="0" r="9" fill="#0284c7" />
      <circle cx="2" cy="1" r="6" fill="#0f172a" />
      <circle cx="-2" cy="-4" r="4" fill="#ffffff" />
      <circle cx="3" cy="3" r="1.8" fill="#ffffff" />
    </g>

    <g transform="translate(175, 134)">
      <ellipse cx="0" cy="0" rx="11" ry="14" fill="#ffffff" />
      <circle cx="-1" cy="0" r="9" fill="#0284c7" />
      <circle cx="-2" cy="1" r="6" fill="#0f172a" />
      <circle cx="-4" cy="-4" r="4" fill="#ffffff" />
      <circle cx="1" cy="3" r="1.8" fill="#ffffff" />
    </g>

    <!-- Glossy Orange Beak -->
    <polygon points="140,146 160,146 150,158" fill="#f97316" stroke="#ea580c" stroke-width="1.5" />
    <circle cx="148" cy="148" r="1.5" fill="#fef08a" />

    <!-- Rosy Cheeks -->
    <circle cx="106" cy="150" r="9" fill="#f43f5e" opacity="0.35" />
    <circle cx="194" cy="150" r="9" fill="#f43f5e" opacity="0.35" />

    <!-- Cozy Winter Scarf -->
    <path d="M 108 172 Q 150 185 192 172 L 195 185 Q 150 200 105 185 Z" fill="#ef4444" />
    <rect x="155" y="180" width="16" height="42" rx="4" fill="#dc2626" />
    <line x1="155" y1="218" x2="171" y2="218" stroke="#fef08a" stroke-width="2" />
  </g>

  <!-- Sweet Wooden Clarinete Held by Penguin -->
  <g transform="translate(142, 160) rotate(15)">
    <!-- Clarinete Tube -->
    <rect x="0" y="0" width="10" height="95" rx="3" fill="url(#clarinet_body)" />
    <!-- Bell at bottom -->
    <path d="M -3 80 L 13 80 L 18 95 L -8 95 Z" fill="url(#clarinet_body)" stroke="#71717a" stroke-width="1" />
    <!-- Metallic silver keys -->
    <g fill="#e4e4e7">
      <circle cx="5" cy="25" r="2.5" />
      <circle cx="5" cy="38" r="2.5" />
      <circle cx="5" cy="50" r="2.5" />
      <circle cx="5" cy="62" r="2.5" />
      <circle cx="5" cy="74" r="2.5" />
      <rect x="9" y="30" width="4" height="2" rx="1" />
      <rect x="9" y="44" width="4" height="2" rx="1" />
      <rect x="9" y="56" width="4" height="2" rx="1" />
    </g>
    <!-- Silver rings -->
    <rect x="0" y="15" width="10" height="2" fill="#cbd5e1" />
    <rect x="0" y="45" width="10" height="2" fill="#cbd5e1" />
  </g>

  <!-- Little Orange Webbed Feet -->
  <ellipse cx="125" cy="245" rx="16" ry="8" fill="#f97316" />
  <ellipse cx="175" cy="245" rx="16" ry="8" fill="#f97316" />
</svg>