<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="abraham_bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </radialGradient>

    <!-- 3D Skin -->
    <radialGradient id="abraham_skin" cx="40%" cy="30%" fx="32%" fy="22%" r="65%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="60%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba858" />
    </radialGradient>

    <!-- 3D Fluffy White Hair -->
    <radialGradient id="abraham_hair" cx="38%" cy="25%" fx="30%" fy="18%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <filter id="shadow_3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="128" fill="url(#abraham_bg)" />
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Twinkling Golden Stars of the Promise -->
  <g fill="#fef08a" opacity="0.6">
    <circle cx="48" cy="46" r="3" />
    <circle cx="204" cy="48" r="3" />
    <circle cx="72" cy="74" r="2" />
    <circle cx="186" cy="80" r="2.5" />
    <polygon points="128,24 130,29 135,30 131,33 132,38 128,35 124,38 125,33 121,30 126,29" />
  </g>

  <!-- Main 3D Cartoon Abraham -->
  <g filter="url(#shadow_3d)">
    <!-- Deep Indigo/Blue Robe -->
    <ellipse cx="128" cy="222" rx="58" ry="42" fill="#3730a3" />
    <path d="M 104 180 Q 128 196 152 180" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="118" y="160" width="20" height="24" rx="10" fill="url(#abraham_skin)" />

    <!-- 3D Face -->
    <ellipse cx="128" cy="126" rx="46" ry="48" fill="url(#abraham_skin)" />

    <!-- Soft Cloud-like White Beard (Kind and Grandfatherly) -->
    <path d="M 90 134 C 90 176, 166 176, 166 134 C 156 168, 100 168, 90 134 Z" fill="url(#abraham_hair)" />

    <!-- Soft Fluffy White Hair -->
    <path d="M 76 114 C 72 78, 98 66, 128 66 C 158 66, 184 78, 180 114 C 184 98, 172 80, 150 80 C 136 80, 134 90, 128 90 C 122 90, 120 80, 106 80 C 86 80, 74 98, 76 114 Z" fill="url(#abraham_hair)" />

    <!-- Big Kind Cartoon Eyes Looking Upward with Wonder -->
    <ellipse cx="110" cy="122" rx="10" ry="13" fill="#ffffff" />
    <ellipse cx="146" cy="122" rx="10" ry="13" fill="#ffffff" />
    <circle cx="111" cy="120" r="7.5" fill="#3b82f6" />
    <circle cx="145" cy="120" r="7.5" fill="#3b82f6" />
    <circle cx="111" cy="120" r="4.5" fill="#1e3a8a" />
    <circle cx="145" cy="120" r="4.5" fill="#1e3a8a" />
    <circle cx="109" cy="117" r="3" fill="#ffffff" />
    <circle cx="143" cy="117" r="3" fill="#ffffff" />
    <circle cx="113" cy="122" r="1.3" fill="#ffffff" />
    <circle cx="147" cy="122" r="1.3" fill="#ffffff" />
    <!-- Friendly Eyebrows -->
    <path d="M 98 108 Q 110 102 122 108" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 134 108 Q 146 102 158 108" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Cute Nose -->
    <path d="M 127 130 Q 128 134 129 130" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="96" cy="134" r="9" fill="#f43f5e" opacity="0.4" />
    <circle cx="160" cy="134" r="9" fill="#f43f5e" opacity="0.4" />

    <!-- Gentle Warm Happy Smile -->
    <path d="M 118 142 Q 128 152 138 142" stroke="#9a3412" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>
</svg>