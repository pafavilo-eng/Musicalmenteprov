<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="daniel_bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- 3D Skin -->
    <radialGradient id="daniel_skin" cx="40%" cy="30%" fx="32%" fy="22%" r="65%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="60%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba858" />
    </radialGradient>

    <!-- 3D Dark Hair -->
    <radialGradient id="daniel_hair" cx="38%" cy="25%" fx="30%" fy="18%" r="65%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <filter id="shadow_3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="128" fill="url(#daniel_bg)" />
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Main 3D Cartoon Daniel -->
  <g filter="url(#shadow_3d)">
    <!-- Elegant Royal Blue Tunic -->
    <ellipse cx="128" cy="220" rx="56" ry="40" fill="#1e3a8a" />
    <!-- Golden Sash & Trim -->
    <path d="M 104 180 Q 128 196 152 180" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="118" y="160" width="20" height="24" rx="10" fill="url(#daniel_skin)" />

    <!-- 3D Face -->
    <ellipse cx="128" cy="128" rx="46" ry="48" fill="url(#daniel_skin)" />

    <!-- Neat 3D Hair with Side Parting -->
    <path d="M 80 114 C 74 86, 96 70, 128 70 C 160 70, 182 86, 176 114 C 172 100, 160 84, 140 84 C 120 84, 114 96, 96 96 C 88 96, 82 104, 80 114 Z" fill="url(#daniel_hair)" />

    <!-- Big Expressive Brown Cartoon Eyes -->
    <ellipse cx="110" cy="126" rx="10" ry="13" fill="#ffffff" />
    <ellipse cx="146" cy="126" rx="10" ry="13" fill="#ffffff" />
    <circle cx="111" cy="126" r="7.5" fill="#451a03" />
    <circle cx="145" cy="126" r="7.5" fill="#451a03" />
    <circle cx="111" cy="126" r="4.5" fill="#000000" />
    <circle cx="145" cy="126" r="4.5" fill="#000000" />
    <circle cx="109" cy="123" r="3" fill="#ffffff" />
    <circle cx="143" cy="123" r="3" fill="#ffffff" />
    <circle cx="113" cy="128" r="1.3" fill="#ffffff" />
    <circle cx="147" cy="128" r="1.3" fill="#ffffff" />
    <path d="M 98 114 Q 110 110 122 114" stroke="#1e293b" stroke-width="2.2" fill="none" stroke-linecap="round" />
    <path d="M 134 114 Q 146 110 158 114" stroke="#1e293b" stroke-width="2.2" fill="none" stroke-linecap="round" />

    <!-- Cute Button Nose -->
    <path d="M 127 134 Q 128 138 129 134" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="96" cy="140" r="9" fill="#f43f5e" opacity="0.4" />
    <circle cx="160" cy="140" r="9" fill="#f43f5e" opacity="0.4" />

    <!-- Gentle Warm Confident Smile -->
    <path d="M 118 146 Q 128 156 138 146" stroke="#9a3412" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Scroll with Musical Notes held in front -->
    <g transform="translate(100, 185)">
      <rect x="0" y="0" width="56" height="26" rx="6" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5" />
      <line x1="12" y1="8" x2="44" y2="8" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />
      <line x1="12" y1="14" x2="44" y2="14" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />
      <line x1="12" y1="20" x2="32" y2="20" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>
</svg>